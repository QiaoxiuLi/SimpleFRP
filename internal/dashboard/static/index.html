<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleFRP Status</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>SimpleFRP</h1>
      <span id="connection-state" role="status">Connecting</span>
    </header>
    <p class="heartbeat">Heartbeat port <strong id="heartbeat-port">Not available</strong></p>
    <section aria-label="Tunnel status">
      <div class="table-scroll">
        <table>
          <thead><tr><th>Tunnel</th><th>Public port</th><th>Local port</th><th>Speed</th><th>Total traffic</th><th>State</th></tr></thead>
          <tbody id="tunnels"></tbody>
        </table>
      </div>
      <p id="empty-state" hidden>No tunnels</p>
    </section>
    <footer><span id="updated-at">Waiting for status</span></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
