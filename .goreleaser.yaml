version: 2
project_name: SimpleFRP
checksum:
  name_template: checksums.txt
release:
  extra_files:
    - glob: scripts/install/linux.sh
      name_template: install-linux.sh
    - glob: scripts/install/macos.sh
      name_template: install-macos.sh
    - glob: scripts/install/windows.ps1
      name_template: install-windows.ps1
    - glob: docs/SimpleFRP_Project_Guide_v0.2.0.pdf
before:
  hooks:
    - go test ./...
builds:
  - id: simplefrp-linux
    main: ./cmd/simplefrp
    binary: simplefrp
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: simplefrp-windows
    main: ./cmd/simplefrp
    binary: simplefrp
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
  - id: simplefrp-macos
    main: ./cmd/simplefrp
    binary: simplefrp
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
nfpms:
  - id: server
    maintainer: QiaoxiuLi
    package_name: simplefrp-server
    file_name_template: "simplefrp-server-linux-{{ .Arch }}"
    conflicts: [simplefrp-client]
    ids: [simplefrp-linux]
    formats: [deb, rpm]
    bindir: /usr/bin
    license: MIT
    scripts:
      preinstall: packaging/linux/preinstall.sh
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh
    contents:
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/simplefrp/THIRD_PARTY_NOTICES.md
      - src: scripts/install/linux.sh
        dst: /usr/share/simplefrp/install-linux.sh
        file_info:
          mode: 0755
      - src: docs/QUICKSTART.md
        dst: /usr/share/doc/simplefrp/QUICKSTART.md
      - src: packaging/linux/simplefrp-server.service
        dst: /usr/lib/systemd/system/simplefrp-server.service
      - src: configs/role.server
        dst: /etc/simplefrp/role
        file_info:
          mode: 0640
  - id: client
    maintainer: QiaoxiuLi
    package_name: simplefrp-client
    file_name_template: "simplefrp-client-linux-{{ .Arch }}"
    conflicts: [simplefrp-server]
    ids: [simplefrp-linux]
    formats: [deb, rpm]
    bindir: /usr/bin
    license: MIT
    scripts:
      preinstall: packaging/linux/preinstall.sh
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh
    contents:
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/simplefrp/THIRD_PARTY_NOTICES.md
      - src: scripts/install/linux.sh
        dst: /usr/share/simplefrp/install-linux.sh
        file_info:
          mode: 0755
      - src: docs/QUICKSTART.md
        dst: /usr/share/doc/simplefrp/QUICKSTART.md
      - src: packaging/linux/simplefrp-client.service
        dst: /usr/lib/systemd/system/simplefrp-client.service
      - src: configs/role.client
        dst: /etc/simplefrp/role
        file_info:
          mode: 0640
archives:
  - id: windows
    ids: [simplefrp-windows]
    formats: [zip]
    name_template: simplefrp-client-windows-amd64
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - src: packaging/windows/install.ps1
        dst: .
        strip_parent: true
      - src: packaging/windows/install.cmd
        dst: .
        strip_parent: true
      - src: packaging/windows/uninstall.ps1
        dst: .
        strip_parent: true
      - src: docs/QUICKSTART.md
        dst: .
        strip_parent: true
  - id: macos
    ids: [simplefrp-macos]
    formats: [tar.gz]
    name_template: "simplefrp-client-darwin-{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - src: docs/QUICKSTART.md
        dst: .
        strip_parent: true
      - src: packaging/macos/install.sh
        dst: .
        strip_parent: true
      - src: packaging/macos/uninstall.sh
        dst: .
        strip_parent: true
