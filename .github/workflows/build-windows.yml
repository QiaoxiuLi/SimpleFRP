name: build-windows
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.1" }
      - run: go test ./...
      - run: make package-windows
      - name: Validate installer syntax and user installation
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows,scripts/install -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          Expand-Archive dist/simplefrp-client-windows-amd64.zip -DestinationPath "$env:RUNNER_TEMP/simplefrp-install"
          & "$env:RUNNER_TEMP/simplefrp-install/install.ps1" -NoStart
          & "$env:LOCALAPPDATA/Programs/SimpleFRP/simplefrp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed client cannot execute' }
          & "$env:LOCALAPPDATA/Programs/SimpleFRP/simplefrp.exe" uninstall
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
