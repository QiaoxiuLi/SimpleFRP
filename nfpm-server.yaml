name: simplefrp-server
arch: amd64
platform: linux
version: 0.2.0
conflicts: [simplefrp-client]
section: net
priority: optional
maintainer: SimpleFRP
description: SimpleFRP server package
contents:
  - src: ./scripts/install/linux.sh
    dst: /usr/share/simplefrp/install-linux.sh
  - src: ./docs/QUICKSTART.md
    dst: /usr/share/doc/simplefrp/QUICKSTART.md
  - src: ./dist/simplefrp
    dst: /usr/bin/simplefrp
  - src: ./packaging/linux/simplefrp-server.service
    dst: /usr/lib/systemd/system/simplefrp-server.service
  - src: ./configs/role.server
    dst: /etc/simplefrp/role
scripts:
  preinstall: ./packaging/linux/preinstall.sh
  postinstall: ./packaging/linux/postinstall.sh
  preremove: ./packaging/linux/preremove.sh
  postremove: ./packaging/linux/postremove.sh
